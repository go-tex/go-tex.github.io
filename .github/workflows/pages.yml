name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The build needs nothing beyond the source and the Pages configuration it
# reads to compute the base URL. Publishing rights are granted to the deploy
# job alone, below, so a pull request build cannot replace what is served.
permissions:
  contents: read
  pages: read

# Keyed by ref, not a single global group. GitHub keeps at most ONE pending
# run per concurrency group: when a third arrives, the one already waiting is
# CANCELLED. With every pull request and every push to main sharing the group
# `pages`, three runs starting in the same minute leave one of them cancelled
# -- and a cancelled run reports no check at all, so that pull request sits
# with nothing to judge it until something re-triggers it. Measured on
# 2026-09-04T19:08: three runs started together and
# renovate/actions-upload-pages-artifact (#135) was the one cancelled; it still
# had no checks three days later. #127 sat the same way.
#
# Per-ref keeps that from happening between branches. Deployment is still
# serialised, because deploy only runs on main and every main run shares
# `pages-refs/heads/main`.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      # Build the playground wasm FRESH from the current source into static/, so the
      # deployed Pages artifact always matches the committed Go code. The compiled
      # wasm is a build artifact — not reproducible byte-for-byte across machines —
      # so it must be built here, not trusted from a hand-committed copy (which is
      # how the round-3 UI shipped silently stale: the source and CI were correct
      # but the committed wasm, which jsDelivr served, was the round-2 binary).
      - name: build playground wasm
        working-directory: playground
        env:
          GOWORK: "off"
        # Bake the build identity INTO the wasm via -ldflags -X so the SHA + time
        # the app shows in its status bar is the one actually running (it survives
        # Pages/CDN caching: a new SHA on screen = the new wasm loaded). The short
        # SHA comes from the checked-out history (the default checkout depth keeps
        # HEAD, so `git rev-parse` resolves without fetch-depth: 0); the time is UTC.
        run: |
          SHA=$(git rev-parse --short HEAD)
          TS=$(date -u +'%Y-%m-%d %H:%M UTC')
          GOOS=js GOARCH=wasm go build -trimpath \
            -ldflags "-X 'main.buildVersion=${SHA}' -X 'main.buildTime=${TS}'" \
            -o ../static/playground.wasm ./cmd/playground-wasm
      # Build the on-demand git worker wasm FRESH too (same freshness reasoning as
      # above). It is loaded in a Web Worker only when the user opens the Git panel,
      # so it stays out of the main playground.wasm download.
      - name: build git worker wasm
        working-directory: playground
        env:
          GOWORK: "off"
        run: GOOS=js GOARCH=wasm go build -trimpath -o ../static/git-worker.wasm ./cmd/git-worker
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.161.1"
          extended: true
      - run: hugo --gc --minify
        env:
          # wasmsha cache-busts the freshly-built Pages copy of the wasm (the primary
          # source) and pins the jsDelivr fallback to this commit.
          HUGO_PARAMS_WASMSHA: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
