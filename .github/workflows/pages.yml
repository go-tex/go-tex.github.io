name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      # Build the playground wasm FRESH from the current source into static/, so the
      # deployed Pages artifact always matches the committed Go code. The compiled
      # wasm is a build artifact — not reproducible byte-for-byte across machines —
      # so it must be built here, not trusted from a hand-committed copy (which is
      # how the round-3 UI shipped silently stale: the source and CI were correct
      # but the committed wasm, which jsDelivr served, was the round-2 binary).
      - name: build playground wasm
        working-directory: playground
        env:
          GOWORK: "off"
        # Bake the build identity INTO the wasm via -ldflags -X so the SHA + time
        # the app shows in its status bar is the one actually running (it survives
        # Pages/CDN caching: a new SHA on screen = the new wasm loaded). The short
        # SHA comes from the checked-out history (the default checkout depth keeps
        # HEAD, so `git rev-parse` resolves without fetch-depth: 0); the time is UTC.
        run: |
          SHA=$(git rev-parse --short HEAD)
          TS=$(date -u +'%Y-%m-%d %H:%M UTC')
          GOOS=js GOARCH=wasm go build -trimpath \
            -ldflags "-X 'main.buildVersion=${SHA}' -X 'main.buildTime=${TS}'" \
            -o ../static/playground.wasm ./cmd/playground-wasm
      # Build the on-demand git worker wasm FRESH too (same freshness reasoning as
      # above). It is loaded in a Web Worker only when the user opens the Git panel,
      # so it stays out of the main playground.wasm download.
      - name: build git worker wasm
        working-directory: playground
        env:
          GOWORK: "off"
        run: GOOS=js GOARCH=wasm go build -trimpath -o ../static/git-worker.wasm ./cmd/git-worker
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.161.1"
          extended: true
      - run: hugo --gc --minify
        env:
          # wasmsha cache-busts the freshly-built Pages copy of the wasm (the primary
          # source) and pins the jsDelivr fallback to this commit.
          HUGO_PARAMS_WASMSHA: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
