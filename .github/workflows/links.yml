name: links

# Taken from go-fileshare.github.io, where a dead repository link on the
# landing went unnoticed until a check like this one read the BUILT site.
#
# ⛔ THE CHECK READS THE BUILT SITE, NOT THE LAYOUTS: templated links such as
# the per-repository cards only become real URLs once Hugo has expanded them.
#
# The checker is `landingkit links` (go-fleettools/landingkit): it replaces a
# hand-written curl loop. Its version is pinned here, not through go.mod: the
# site renders with landingkit v0.7.1, and the checker must not move that.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: every link and image resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Hugo resolves the landingkit module (hugo.toml [module]) with the go
      # command, at the version go.mod pins.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true
      - run: hugo --minify --destination ./public
      - name: Check
        env:
          GOWORK: "off"
        run: go run github.com/go-fleettools/landingkit/cmd/landingkit@v0.20.0 links public
