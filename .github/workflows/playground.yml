name: playground

on:
  push:
    branches: [main]
    paths: ["playground/**", ".github/workflows/playground.yml"]
  pull_request:
    paths: ["playground/**", ".github/workflows/playground.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test (100% coverage lanes)
        run: go test -race -cover ./...
      - name: cross-compile to js/wasm
        run: GOOS=js GOARCH=wasm go build ./...
