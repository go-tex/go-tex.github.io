packages:
  - { name: "engine", abbr: "EN", desc: "The pure-Go TeX engine — faithful mouth + gullet, scaled-point stomach with Knuth–Plass line breaking, ~306 primitives, e-TeX, \\halign tables, math, OpenType fonts, PDF/SVG output, and the real embedded LaTeX classes (article/report/book/amsart), native and js/wasm.", url: "https://github.com/go-tex/engine", doc: "https://pkg.go.dev/github.com/go-tex/engine" }
  - { name: "math", abbr: "MA", desc: "Pure-Go TeX math-mode typesetter → self-contained SVG via the OpenType MATH table (fractions, radicals, matrices, big operators with limits, stretchy delimiters, scripts, ~200 named symbols, \\mathbb/\\mathcal/…). Ships STIX Two Math; wasm-ready.", url: "https://github.com/go-tex/math", doc: "https://pkg.go.dev/github.com/go-tex/math" }
  - { name: "pdfrender", abbr: "PR", desc: "Pure-Go (CGO=0) rasteriser for PDF figures. Plugs into the engine's RasterizePDF seam so \\includegraphics{fig.pdf} renders raster pixels instead of a framed placeholder. A separate module, to keep the engine/wasm core free of a heavy dependency.", url: "https://github.com/go-tex/pdfrender", doc: "https://pkg.go.dev/github.com/go-tex/pdfrender" }
  - { name: "texmf", abbr: "TM", desc: "Pure-Go on-demand TeX support-tree fetcher for machines with no TeX distribution. Redistributes nothing: fetches pinned, SHA-256-verified upstream macro source into a user cache, and supplies Tree.Resolve to the engine. Never fetches speculatively.", url: "https://github.com/go-tex/texmf", doc: "https://pkg.go.dev/github.com/go-tex/texmf" }
