<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>go-tex playground — full-height + zones proof</title>
    <style>
      /* The SAME full-height flex column the Hugo playground page uses: a blue
         header at its natural height, then the canvas stage flexing to fill the
         whole remaining viewport. The moved-in status line (topZone) and
         description/footer (bottomZone) live INSIDE the wasm now, so there is no
         HTML around the canvas anymore. */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .hero {
        flex: 0 0 auto;
        background: linear-gradient(135deg, #3b82f6, #1e3a8a);
        color: #fff;
        padding: 40px 24px;
        text-align: center;
      }
      .pg {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 12px;
      }
      .stage {
        flex: 1 1 auto;
        min-height: 0;
      }
      #gotex-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <section class="hero"><h1>Try it in your browser</h1></section>
    <div class="pg">
      <div class="stage"><canvas id="gotex-canvas"></canvas></div>
    </div>
    <!-- The Go toolchain's own loader, copied beside the wasm by the test. -->
    <script src="wasm_exec.js"></script>
    <script>
      (async () => {
        try {
          const go = new Go();
          const result = await WebAssembly.instantiateStreaming(
            fetch("client.wasm"),
            go.importObject,
          );
          go.run(result.instance);
        } catch (err) {
          console.log("DONE page failed to run the wasm: " + err);
          globalThis.__bootError = String(err);
        }
      })();
    </script>
  </body>
</html>
