<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>go-tex playground — searchable render proof</title>
    <style>
      html, body { margin: 0; background: #ffffff; }
      /* The overlay positions itself absolutely inside the canvas's parent, so
         the parent must be positioned. That is the host page's only obligation
         (the live site's .stage already is). */
      .stage { position: relative; width: 1100px; height: 820px; }
      #gotex-canvas { display: block; width: 100%; height: 100%; }
      #gotex-textlayer svg { display: block; }
    </style>
  </head>
  <body>
    <div class="stage"><canvas id="gotex-canvas"></canvas></div>
    <script src="wasm_exec.js"></script>
    <script>
      (async () => {
        try {
          const go = new Go();
          const result = await WebAssembly.instantiateStreaming(
            fetch("client.wasm"),
            go.importObject,
          );
          go.run(result.instance);
        } catch (err) {
          console.log("DONE page failed to run the wasm: " + err);
          globalThis.__bootError = String(err);
        }
      })();
    </script>
  </body>
</html>
