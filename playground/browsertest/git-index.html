<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>go-tex playground — off-thread git-worker two-wasm proof</title>
    <style>
      #gotex-canvas {
        width: 1100px;
        height: 800px;
        display: block;
        background: #fff;
        border: 1px solid #999;
      }
    </style>
  </head>
  <body>
    <h3>go-tex playground: the Git panel driven by a separate git-worker.wasm</h3>
    <canvas id="gotex-canvas"></canvas>
    <!-- Point the app at the worker bootstrap (served beside this page). The real
         Pages template sets this from Hugo with a ?v=<sha> cache-bust; the test
         serves fresh files so a bare name is enough. -->
    <script>
      globalThis.gotexGitWorkerURL = "git-worker.js";
    </script>
    <!-- The Go toolchain's own loader (copied to js/ beside the wasm by the test). -->
    <script src="js/wasm_exec.js"></script>
    <script>
      (async () => {
        try {
          const go = new Go();
          const result = await WebAssembly.instantiateStreaming(
            fetch("playground.wasm"),
            go.importObject,
          );
          go.run(result.instance);
        } catch (err) {
          console.log("BOOT_FAIL the page failed to run playground.wasm: " + err);
          globalThis.__bootError = String(err);
        }
      })();
    </script>
  </body>
</html>
