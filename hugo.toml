baseURL = "https://go-tex.github.io/"
locale = "en-us"
title = "go-tex"
# No theme -- the layout is the go-* family template go-fft.github.io uses: one
# self-contained layouts/index.html, with the design coming from the landing kit.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

# The design -- layouts/partials/styles.html, theme-toggle.html, fork-ribbon.html
# and icons/{github,book}.html -- comes from the shared Hugo module
# github.com/go-fleettools/landingkit, not from copies here: the copies drifted.
# Its version is pinned in go.mod (Renovate bumps it), and kit.go keeps
# `go mod tidy` from deleting that requirement. A file of the same name under
# layouts/partials/ would silently override the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-tex is a pure-Go (CGO=0) TeX engine that loads and runs the genuine LaTeX classes — article, report and book — in Go and in the browser, with no TeXLive and no server."

# The repository cards (#repos) and the count in the strip come from this list,
# never from a number typed beside it.
[[params.repos]]
  name  = "engine"
  kind  = "engine"
  href  = "https://github.com/go-tex/engine"
  blurb = "The pure-Go TeX engine: a faithful mouth and gullet, a scaled-point stomach with Knuth–Plass line breaking and a cost-based page builder that keeps <code>page_total</code> and <code>page_depth</code> apart, <code>\\halign</code> tables, e-TeX, math, OpenType fonts, PDF and SVG output, and the real embedded LaTeX classes (article, report, book, amsart), native and <code>js/wasm</code>."
[[params.repos]]
  name  = "math"
  kind  = "library"
  href  = "https://github.com/go-tex/math"
  blurb = "Pure-Go TeX math-mode typesetter to self-contained SVG, through the OpenType MATH table: fractions, radicals, matrices, big operators with limits, stretchy delimiters, scripts. Ships STIX Two Math; wasm-ready."
[[params.repos]]
  name  = "pdfrender"
  kind  = "library"
  href  = "https://github.com/go-tex/pdfrender"
  blurb = "Pure-Go (CGO=0) rasteriser for PDF figures. Plugs into the engine's <code>RasterizePDF</code> seam so <code>\\includegraphics{fig.pdf}</code> renders pixels instead of a framed placeholder. A separate module, to keep the engine and wasm core free of a heavy dependency."
[[params.repos]]
  name  = "texmf"
  kind  = "library"
  href  = "https://github.com/go-tex/texmf"
  blurb = "On-demand TeX support-tree fetcher for machines with no TeX distribution. Redistributes nothing: it fetches pinned, SHA-256-verified upstream macro source into a user cache and supplies <code>Tree.Resolve</code> to the engine. Never fetches speculatively."
[[params.repos]]
  name  = "tex"
  kind  = "library"
  href  = "https://github.com/go-tex/tex"
  blurb = "Pure-Go (CGO=0) processor for a subset of LaTeX documents: macro expansion, structure and math to semantic HTML rather than to a page. Where the engine typesets, this one reads — a foundation for full LaTeX on the HTML path."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-tex.github.io/docs/"
  blurb = "The documentation site (MkDocs Material + mike), versioned, at <code>/docs/</code>. The <a href=\"/capabilities/\">capability reference</a> — every supported feature and every remaining gap, class by class and package by package — is published by THIS site, at <code>/capabilities/</code>: a project Pages site wins <code>/docs/</code> over an organisation site's directory of the same name, which is why it is not there. <a href=\"https://github.com/go-tex/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-tex/brand"
  blurb = "Logos and icons for the organization."

# The capability cards (#capabilities) and the count in the heading come from
# this list.
[[params.families]]
  name = "Real base classes"
  what = "`article`, `report` and `book` load and run the genuine embedded LaTeX `.cls` files — numbered title, dotted TOC, numbered sections and chapters, figure and table captions, lists, math."
[[params.families]]
  name = "Faithful engine"
  what = "Category-code mouth and gullet, a scaled-point stomach with Knuth–Plass line breaking, a cost-based page builder that keeps TeX's `page_total` and `page_depth` apart — the depth of a page's last line is capped at `\\maxdepth` and not charged against the goal, so a page that fills to exactly `\\textheight` is accepted — and `\\halign` tables."
[[params.families]]
  name = "Math and fonts"
  what = "Math via go-tex/math (vector output); OpenType fonts with a built-in default font, kerning and ligatures — runs with no assets, and a full family (roman, bold, italic, slanted, typewriter, sans) when one is given. The size ladder is the class's own table to the point, not a whole-point approximation of it: all ten of `\\tiny`…`\\Huge` match tectonic, including the three that are not whole numbers (`\\Large` 14.4, `\\LARGE` 17.28, `\\huge` 20.74), and an `[11pt]` class sets its body at the 10.95 its `\\@xipt` states. Kerning comes from every GPOS lookup rather than the first that covers a pair: `\\hbox{AV}` in Libertinus at 10pt is 12.35pt, XeTeX's own figure, where stopping at the first lookup gave 13.47."
[[params.families]]
  name = "PDF and SVG output"
  what = "Embedded-subset-font PDF with selectable text, and self-contained SVG pages carrying a source map for click-to-line."
[[params.families]]
  name = "In the browser"
  what = "A self-contained `js/wasm` build renders real LaTeX classes client-side — no TeXLive, no server."
[[params.families]]
  name = "Safe on untrusted input"
  what = "A `.tex` is a program, and the playground runs whatever you paste. A document compiled by the engine cannot run a process, cannot write a file, cannot read one outside the search roots (TeX Live's `openin_any=p`, with `GOTEX_READ_ANY=1` as a named opt-out), and cannot exhaust memory or run forever: one paragraph is capped at 200 000 nodes."
[[params.families]]
  name = "Held to fidelity"
  what = "A byte-exact conformance ratchet plus a whole-document prose check against a real LaTeX engine (tectonic): on the **121 of 154** papers whose reference carries a bibliography the check can read, the median |r−1| is 1.69%, with 86 within ±5% and 101 within ±10% (`measure fid`, label `elevenpt-trt`, at engine v0.271.0). The other 33 are **named, not hidden in the denominator**: 32 references without a bibliography and one unreadable. This sentence used to quote the whole 154 for a check that runs on 121, and a statistic the tool does not print — a hidden denominator of exactly the kind this project files defects about, and the figure is now the one `fid` reports, at the version it was reported for (go-tex.github.io#220). Pagination lands on the reference exactly for 47 of the 154, with a total absolute deviation of 272 pages and a signed bias of −12 — down from +50, because the page builder no longer fires a page the moment its height passes \\vsize: TeX fires it when the excess beats what the page's own glue can shrink away (engine#693). The 272 is the open figure, tracked as engine#695. It is also the wrong number to read some work by: it counts PAGES, so a change that moves glyphs inside a line — a kern, a heading set at 14.4pt instead of 14 — costs a page only when it tips one. Making the size ladder exact changed 124 of the 154 renders and moved this figure by zero (engine#716), and giving running heads their marks changed 6 renders at identical page counts — visible only to a per-page hash, and worth 27 of the 128 papers with a reference getting the head they had been missing (engine#426, engine#729). That one took four fixes, three of them correct and insufficient: a one-line stub that discarded `\\mark`'s argument sat one layer below all three, and what found it was a test asking not whether the layer was right but whether the node arrived."

[params.brand]
# Generated by go-fleettools/landingkit from static/favicon.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 15.99:1, bright on the dark background 3.07:1.
  base = "#1e1b4b"
  deep = "#12102e"
  bright = "#4f46e5"
  shadow = "rgba(30,27,75,.7)"
  glow = "rgba(30,27,75,.6)"
  wash = "rgba(30,27,75,.10)"
  washDeep = "rgba(18,16,46,.06)"
  chipBg = "#eae9fc"
  chipBorder = "#cac8f7"
  chipFg = "#12102e"
  chipBgDark = "rgba(79,70,229,.14)"
  chipBorderDark = "rgba(79,70,229,.32)"
  chipFgDark = "#9e99f1"
  statsEnd = "#d5d3f9"
  bandText = "#e3e1fb"

# The strip under the top bar: how the code is built, then everything that is a
# LICENCE, together.
#
# ⚠ THE ORDER IS THE GROUPING. The kit lays four chips out two to a row, so the
# order decides what sits beside what. It used to read
#
#   LICENSE=BSD-3-Clause   CGO_ENABLED=0
#   macros: LPPL-1.3c      fonts: OFL-1.1
#
# which split the three licences across both rows and put the build flag in the
# middle of them. Now the flag leads and the licences run together — BSD for the
# code, LPPL for the macros, OFL for the fonts — so a reader counting what this
# project is licensed under reads three chips in sequence rather than hunting.
[params.mantra]
  items = ["CGO_ENABLED=0", "LICENSE=BSD-3-Clause", "macros: LPPL-1.3c", "fonts: OFL-1.1"]

# The second corner band, parallel to "Fork me on GitHub" and outside it. That
# one says the code can be taken; this says what it is taken into. The kit
# draws the band and ships no default link, so the destination is named here.
[params.commons]
  url = "https://en.wikipedia.org/wiki/Digital_commons"

# The other sites of this organisation, hanging from the title in the top bar
# (the kit's brand-menu.html). go-tex itself is NOT a row: a reader opening this
# menu is already on that page.
#
# The icon is each site's own favicon, served by that site — not a copy here,
# which would go stale the day they rebrand.
[[params.siblings]]
  name = "go-pdfkit"
  url  = "https://go-pdfkit.github.io"
  icon = "https://go-pdfkit.github.io/favicon.svg"

[[params.siblings]]
  name = "go-slides"
  url  = "https://go-slides.github.io"
  icon = "https://go-slides.github.io/favicon.svg"
