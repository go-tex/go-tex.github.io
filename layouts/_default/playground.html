<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>go-tex — Try it: live LaTeX in your browser</title>
<meta name="description" content="Type LaTeX and watch the pure-Go go-tex engine typeset it — a single go-widgets canvas app (editor + renderer) compiled to WebAssembly, no TeXLive and no server.">
<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
<link rel="stylesheet" href="{{ "css/brand.css" | relURL }}">
<script src="{{ "js/theme.js" | relURL }}"></script>
<style>
/* Playground-only styles — kept off every other page. */
/* The page is a full-height flex column: the blue header keeps its natural
   height and the canvas stage flexes to fill the whole remaining viewport, so
   the one go-widgets WebAssembly app runs edge-to-edge below the header. The
   status line that used to sit above the canvas and the description/footer that
   sat below it now live INSIDE the wasm (its topZone / bottomZone), painted by
   the toolkit — see playground/zones.go. */
html,body{height:100%}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.hero.mini{flex:0 0 auto;padding:48px 24px 40px}
.hero.mini h1{font-size:40px}
.hero .caption{font-size:14px;opacity:.9;max-width:680px;margin:14px auto 0}
.hero .caption code{background:rgba(255,255,255,.16);padding:1px 6px;border-radius:5px}
/* margin is "16px 0", NOT "16px auto": body is a flex column, and auto cross-axis
   margins on a flex item cancel align-items:stretch — the pg column would shrink to
   its content width and centre, leaving the canvas narrower than the window (and
   breaking the full-height flex chain). With no auto margins it stretches to the
   full width and flex:1 fills the height. */
.pg{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;max-width:none;margin:16px 0;padding:0 16px}
/* The whole playground is ONE go-widgets canvas: editor on the left, the live
   gotex render on the right, its own status bar plus the moved-in topZone /
   bottomZone — all painted by the toolkit in WebAssembly. It flexes to fill the
   viewport below the blue header (with a sensible floor on short screens). */
.stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 10px 30px var(--shadow);overflow:hidden;flex:1 1 auto;min-height:520px}
#gotex-canvas{display:block;width:100%;height:100%;background:var(--bg);opacity:0;transition:opacity .25s}
/* The rendered pages themselves. The render pane lays them out and paints their
   paper on the canvas; the BROWSER draws the pages, as SVG — 2.7x faster than
   rasterising them in wasm, crisp at any zoom, and searchable. The container
   positions ITSELF (see cmd/playground-wasm/domrender.go); the only thing
   needed here is that its parent .stage is positioned, which it is, and that an
   <svg> inside it does not inherit an inline-element baseline gap. */
#gotex-pages svg{display:block}
.stage.ready #gotex-canvas{opacity:1}
/* HTML loading placeholder: a two-pane skeleton with a real progress bar driven
   by the streamed wasm download; hidden once the app signals it is ready. */
#pg-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--card)}
.stage.ready #pg-placeholder{display:none}
.pg-skel{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
.pg-skel>div{border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(100deg,var(--bg) 30%,var(--line) 50%,var(--bg) 70%);
  background-size:200% 100%;animation:pgshimmer 1.4s linear infinite}
@keyframes pgshimmer{to{background-position:-200% 0}}
.pg-load{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);
  font-size:13px;padding-bottom:6px}
.pg-track{width:min(440px,72%);height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.pg-fill{height:100%;width:0;background:var(--from);transition:width .15s ease}
#pg-pct{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
#err{display:none;margin:0 0 14px;padding:11px 13px;border-radius:10px;
  background:#fdecec;color:#9b1c1c;white-space:pre-wrap;
  font:12.5px/1.45 ui-monospace,Menlo,monospace}
:root[data-theme="dark"] #err{background:#3a1113;color:#f7b4b4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #err{background:#3a1113;color:#f7b4b4}}
#err.show{display:block}
</style>
</head><body>
<section class="hero mini">
  <button id="themebtn" class="theme" type="button">Theme: System</button>
  <img src="{{ "img/go-tex-white.png" | relURL }}" alt="go-tex" style="width:76px;height:76px">
  <h1>Try it in your browser</h1>
  <p>Type LaTeX on the left, watch the pure-Go engine typeset it on the right.</p>
  <p class="caption">One <code>go-widgets</code> canvas app — editor and renderer — executed in WebAssembly. No TeXLive, no server.</p>
</section>

<div class="pg">
  <div id="err"></div>
  <div class="stage">
    <canvas id="gotex-canvas"></canvas>
    <div id="pg-placeholder">
      <div class="pg-skel"><div></div><div></div></div>
      <div class="pg-load">
        <div id="pg-msg">Downloading the WebAssembly engine…</div>
        <div class="pg-track"><div class="pg-fill" id="pg-fill"></div></div>
        <div id="pg-pct">0%</div>
      </div>
    </div>
  </div>
</div>

<script src="{{ "js/wasm_exec.js" | absURL }}"></script>
<script>
"use strict";
(function(){
  var $=function(id){return document.getElementById(id);};
  var errBox=$("err");
  // The app wasm (~21 MB, ~6 MB gzip on the wire — measured against the live URL,
  // not the repository) is built FRESH by the pages deploy and served from our own
  // Pages origin, cache-busted with the commit sha (?v=…) so every deploy is a new
  // URL that always matches the deployed Go source.
  //
  // There is deliberately NO CDN fallback. There used to be one — jsDelivr pinned
  // to the same commit — but jsDelivr serves what is COMMITTED, and the committed
  // copy was a build artifact nobody rebuilt: by 2026-08-25 it was 35 playground
  // commits behind. A fallback that silently boots a five-week-old application is
  // worse than a visible failure, and an immutable pointer to the wrong bytes is
  // not a virtue. The wasm is now a build artifact like git-worker.wasm — built at
  // deploy, absent from the repository — and a failed load says so.
  {{ $sha := .Site.Params.wasmsha }}
  {{ $local := "playground.wasm" | absURL }}
  {{ $primary := $local }}
  {{ with $sha }}{{ $primary = printf "%s?v=%s" $local . }}{{ end }}
  var wasmURL={{ $primary }};
  // The DECOMPRESSED wasm size, read at build time from the freshly-built asset.
  // Pages serves the wasm gzip-compressed (~⅓ the size over the wire), but the
  // stream reader yields DECOMPRESSED bytes while Content-Length is the COMPRESSED
  // length — so we drive the progress bar against this real decompressed total,
  // or the bar would shoot past 100%.
  // Zero when the wasm has not been built (a local `hugo server` without the build
  // step); the loader then drives the bar off Content-Length instead.
  {{ $wasmBytes := 0 }}{{ with (os.Stat "static/playground.wasm") }}{{ $wasmBytes = .Size }}{{ end }}
  var wasmBytes={{ $wasmBytes }};
  var started=false;

  // The Git panel's remote-git client lives in a SEPARATE git-worker.wasm, loaded
  // on demand in a Web Worker the first time a user opens the Git panel (so the
  // base download never pays for go-git). Publish the cache-busted worker
  // bootstrap URL for the wasm to spawn; the ?v=<sha> is inherited by the worker's
  // own git-worker.wasm fetch, the same anti-stale trick as the main wasm above.
  {{ $gitWorker := "git-worker.js" | absURL }}
  {{ with $sha }}{{ $gitWorker = printf "%s?v=%s" $gitWorker . }}{{ end }}
  globalThis.gotexGitWorkerURL={{ $gitWorker }};

  // Resolve the host page's theme (data-theme, else prefers-color-scheme) to a
  // dark boolean, and keep the canvas app in sync as theme.js flips it.
  function isDark(){
    var t=document.documentElement.getAttribute("data-theme");
    if(t==="dark") return true;
    if(t==="light") return false;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function syncTheme(){ if(globalThis.gotexSetTheme) globalThis.gotexSetTheme(isDark()); }
  new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  if(window.matchMedia){ try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",syncTheme); }catch(e){} }

  // setProgress drives the placeholder bar. frac in [0,1]; pass null for an
  // indeterminate stream (a server that sent no Content-Length).
  function setProgress(frac){
    var fill=$("pg-fill"), pct=$("pg-pct");
    if(!fill) return;
    if(frac==null){ fill.style.width="100%"; fill.style.opacity="0.45"; pct.textContent="…"; return; }
    var p=Math.max(0,Math.min(100,Math.round(frac*100)));
    fill.style.opacity="1"; fill.style.width=p+"%"; pct.textContent=p+"%";
  }

  function loadEngine(){
    if(started) return; started=true;
    var go=new Go();
    var boot=function(result){
      setProgress(1);
      $("pg-msg").textContent="Starting the engine…";
      go.run(result.instance);
      var t=setInterval(function(){
        if(globalThis.gotexPlaygroundReady){
          clearInterval(t);
          document.querySelector(".stage").classList.add("ready"); // reveal canvas, hide placeholder
          // The "engine ready" status line now lives inside the wasm (its topZone),
          // so there is no HTML status/dot/version to update here anymore.
          syncTheme();
        }
      },50);
    };
    var fail=function(e){
      $("pg-msg").textContent="Engine failed to load.";
      var hint = location.protocol==="file:"
        ? "\n(open this page over http:// — file:// blocks fetching the engine.)"
        : "\n(try a hard refresh — the engine asset may be cached stale.)";
      errBox.textContent="Failed to load playground.wasm: "+String(e)+hint;
      errBox.classList.add("show");
    };
    // streamFetch downloads the wasm through a ReadableStream reader, updating the
    // progress bar from the received/Content-Length ratio, then verifies the wasm
    // magic number and instantiates. It replaces instantiateStreaming precisely so
    // the multi-megabyte download shows real progress instead of a blank gap.
    function streamFetch(url){
      return fetch(url,{cache:"reload"}).then(function(r){
        if(!r.ok) throw new Error("HTTP "+r.status+" fetching the engine at "+url);
        // Prefer the build-time DECOMPRESSED size: the reader below yields
        // decompressed bytes, so a compressed Content-Length would make the bar
        // overshoot. Fall back to Content-Length when the size is unknown.
        var total=wasmBytes||parseInt(r.headers.get("Content-Length")||"0",10)||0;
        if(!r.body||!r.body.getReader){ return r.arrayBuffer(); } // no streaming: one shot
        var reader=r.body.getReader(), received=0, chunks=[];
        return (function pump(){
          return reader.read().then(function(res){
            if(res.done){
              var buf=new Uint8Array(received), pos=0;
              for(var i=0;i<chunks.length;i++){ buf.set(chunks[i],pos); pos+=chunks[i].length; }
              return buf.buffer;
            }
            chunks.push(res.value); received+=res.value.length;
            setProgress(total?received/total:null);
            return pump();
          });
        })();
      }).then(function(ab){
        var m=new Uint8Array(ab,0,4);
        if(!(m[0]===0x00&&m[1]===0x61&&m[2]===0x73&&m[3]===0x6d))
          throw new Error("the engine URL did not return a WebAssembly module");
        return WebAssembly.instantiate(ab,go.importObject);
      });
    }
    streamFetch(wasmURL).then(boot).catch(fail);
  }

  // Lazy-load: fetch the wasm once the stage scrolls into view (it is above the
  // fold, so this fires right after first paint).
  function arm(){
    if("IntersectionObserver" in window){
      var io=new IntersectionObserver(function(entries){
        for(var i=0;i<entries.length;i++){
          if(entries[i].isIntersecting){ io.disconnect(); loadEngine(); return; }
        }
      },{rootMargin:"200px"});
      io.observe(document.querySelector(".stage"));
    } else { loadEngine(); }
  }
  if(document.readyState!=="loading") arm();
  else document.addEventListener("DOMContentLoaded",arm);
})();
</script>
</body></html>
